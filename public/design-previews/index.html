</style></head><body><main class="wrap"><div class="kicker">Jchat · Design directions</div><h1>选择一种对话的温度</h1><p class="lead">三个方案共享相同的信息架构与线性 SVG 图标，仅改变色彩、透明度和空间气质。打开任意方案可进入完整聊天预览，并在右上角快速切换。</p><section class="grid"><a class="card" href="warm-glass.html"><span class="tag">推荐方案 A</span><div class="swatch"></div><h2>暖陶玻璃</h2><p>Claude 式暖米白与陶土色，玻璃层次最完整，亲和且具有品牌辨识度。</p><span class="arrow">→</span></a><a class="card" href="minimal-glass.html"><span class="tag">方案 B</span><div class="swatch"></div><h2>轻玻璃极简</h2><p>更低的模糊与阴影，内容优先、干净克制，也更适合低性能设备。</p><span class="arrow">→</span></a><a class="card dark" href="dark-amber.html"><span class="tag">方案 C</span><div class="swatch"></div><h2>深色琥珀</h2><p>深棕夜色搭配琥珀橙，适合长时间聊天和更沉浸的夜间氛围。</p><span class="arrow">→</span></a></section></main></body></html>
