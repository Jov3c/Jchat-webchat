<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Jchat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/jchat-design-system.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/anatomy-account-admin.css">
</head>
<body class="auth-page auth-page--login anatomy-account-page">
    <main class="container anatomy-page-shell">
        <div class="version-info" id="versionInfo"></div>
        <header class="anatomy-account-topbar">
            <a class="anatomy-brand-link" href="login.html" aria-label="Jchat 登录首页">
                <span class="anatomy-wordmark">Jchat<span>+</span></span>
            </a>
            <p>Conversation atelier</p>
        </header>
        <div class="login-container jc-glass anatomy-auth-layout" data-anatomy-region="auth-layout">
            <section class="video-container auth-visual anatomy-auth-art anatomy-auth-media-panel anatomy-paper-card" data-anatomy-region="auth-art" aria-hidden="true">
                <video class="anatomy-auth-media" autoplay muted loop playsinline>
                    <source src="videos/bg1.mp4" type="video/mp4">
                </video>
            </section>

            <section class="login-box anatomy-auth-form anatomy-paper-card" data-anatomy-region="auth-form" aria-labelledby="loginTitle">
                <div class="logo">
                    <span class="anatomy-form-wordmark" aria-hidden="true">Jchat<span>+</span></span>
                    <p class="auth-kicker">欢迎回来</p>
                    <h2 id="loginTitle">登录 Jchat</h2>
                </div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <div class="password-field">
                            <input type="password" id="password" name="password" autocomplete="current-password" required>
                            <button class="password-toggle" type="button" data-password-toggle aria-controls="password" aria-pressed="false" aria-label="显示密码">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-5.2 9.5-5.2 9.5 5.2 9.5 5.2-3.4 5.2-9.5 5.2S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>
                                <span class="visually-hidden" data-password-toggle-label>显示密码</span>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">登录</button>
                </form>
                <p class="register-link">还没有账号？<a href="register.html">立即注册</a></p>
                <div id="errorMessage" class="error-message" role="alert" aria-live="polite"></div>
            </section>
        </div>
    </main>

    <script src="js/auth-storage.js"></script>
    <script src="js/auth.js"></script>
    <script data-auth-page-script>
        document.querySelectorAll('[data-password-toggle]').forEach(function (button) {
            button.addEventListener('click', function () {
                var input = document.getElementById(button.getAttribute('aria-controls'));
                if (!input) return;
                var willShow = input.type === 'password';
                input.type = willShow ? 'text' : 'password';
                button.setAttribute('aria-pressed', String(willShow));
                button.setAttribute('aria-label', willShow ? '隐藏密码' : '显示密码');
                var label = button.querySelector('[data-password-toggle-label]');
                if (label) label.textContent = willShow ? '隐藏密码' : '显示密码';
            });
        });
    </script>
    <script>
        // 检查注册功能状态
        fetch('/api/registration-status')
            .then(response => response.json())
            .then(data => {
                const registerLink = document.querySelector('.register-link');
                if (!data.enabled && registerLink) {
                    registerLink.style.display = 'none';
                }
            })
            .catch(error => {
                console.error('获取注册状态失败:', error);
            });

        // 获取并显示版本号
        fetch('/api/version')
            .then(response => response.json())
            .then(data => {
                const versionElement = document.getElementById('versionInfo');
                if (versionElement) {
                    versionElement.textContent = data.version;
                }
            })
            .catch(error => {
                console.error('获取版本号失败:', error);
            });
    </script>
</body>
</html>
