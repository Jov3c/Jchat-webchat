<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - Jchat 账号</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/jchat-design-system.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/anatomy-account-admin.css">
</head>
<body class="auth-page auth-page--register anatomy-account-page">
    <!-- 注册阶段 -->
    <div class="register-phase" id="registerPhase">
        <main class="container anatomy-page-shell">
            <div class="version-info" id="versionInfo"></div>
            <header class="anatomy-account-topbar">
                <a class="anatomy-brand-link" href="login.html" aria-label="返回 Jchat 登录">
                    <span class="anatomy-wordmark">Jchat<span>+</span></span>
                </a>
                <p>Account atelier</p>
            </header>
            <div class="login-container jc-glass anatomy-auth-layout" data-anatomy-region="auth-layout">
                <section class="image-container auth-visual anatomy-auth-art anatomy-auth-media-panel anatomy-register-art anatomy-paper-card" data-anatomy-region="auth-art" aria-hidden="true">
                    <img class="anatomy-auth-media" src="images/bg2.png" alt="">
                </section>
                <section class="login-box anatomy-auth-form anatomy-paper-card" data-anatomy-region="auth-form" aria-labelledby="registerTitle">
                    <div class="logo">
                        <span id="registerLogo" class="anatomy-form-wordmark" aria-label="Jchat">Jchat<span>+</span></span>
                        <p class="auth-kicker">加入 Jchat</p>
                        <h2 id="registerTitle">创建 Jchat 账号</h2>
                    </div>
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="username">用户名</label>
                            <input type="text" id="username" name="username" autocomplete="username" required autofocus placeholder="2-20 位，字母、数字或下划线" aria-describedby="usernameHint">
                            <p class="form-hint" id="usernameHint">用于登录，创建后请妥善记住。</p>
                        </div>
                        <div class="form-group">
                            <label for="password">密码</label>
                            <div class="password-field">
                                <input type="password" id="password" name="password" autocomplete="new-password" required placeholder="至少 8 位，包含字母和数字" aria-describedby="passwordHint">
                                <button class="password-toggle" type="button" data-password-toggle aria-controls="password" aria-pressed="false" aria-label="显示密码">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-5.2 9.5-5.2 9.5 5.2 9.5 5.2-3.4 5.2-9.5 5.2S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>
                                    <span class="visually-hidden" data-password-toggle-label>显示密码</span>
                                </button>
                            </div>
                            <p class="form-hint" id="passwordHint">建议使用独特且容易记住的密码。</p>
                        </div>
                        <button type="submit" class="btn-primary">注册</button>
                    </form>
                    <p class="register-link">已有账号？<a href="login.html">立即登录</a></p>
                    <div id="errorMessage" class="error-message" role="alert" aria-live="polite"></div>
                </section>
            </div>
        </main>
    </div>

    <!-- 圆形遮罩：注册成功后盖住画面再收缩消失 -->
    <div class="setup-reveal-mask" id="revealMask"></div>

    <!-- 完善资料阶段 -->
    <div class="setup-phase" id="setupPhase">
        <header class="setup-top">
            <span class="logo anatomy-setup-wordmark" aria-label="Jchat">Jchat<span>+</span></span>
            <a href="index.html" class="setup-skip-link">暂不设置</a>
        </header>
        <main class="setup-main">
            <section class="setup-step active" data-step="0">
                <div class="setup-step-content">
                    <h2>设置头像</h2>
                    <p class="sub">上传一张照片，让他人更容易认出你</p>
                    <div class="field-wrap avatar-step-inner">
                        <label for="avatarInput" class="avatar-ring">
                            <img id="avatarPreview" src="images/default.png" alt="头像">
                        </label>
                        <label for="avatarInput" class="btn-avatar">更换头像</label>
                        <input type="file" id="avatarInput" accept="image/*">
                    </div>
                </div>
            </section>
            <section class="setup-step" data-step="1">
                <div class="setup-step-content">
                    <h2>社交昵称与邮箱</h2>
                    <p class="sub">其他用户将看到你的昵称</p>
                    <div class="field-wrap" style="margin-bottom: 20px;">
                        <label for="nickname">社交昵称</label>
                        <input type="text" id="nickname" placeholder="默认为用户名" autocomplete="off">
                    </div>
                    <div class="field-wrap">
                        <label for="email">邮箱（可选）</label>
                        <input type="email" id="email" placeholder="请输入邮箱" autocomplete="email">
                    </div>
                </div>
            </section>
            <section class="setup-step" data-step="2">
                <div class="setup-step-content">
                    <h2>个性签名</h2>
                    <p class="sub">用一句话介绍自己</p>
                    <div class="field-wrap">
                        <label for="bio">个性签名</label>
                        <textarea id="bio" placeholder="介绍一下自己吧..." rows="4"></textarea>
                    </div>
                </div>
            </section>
            <section class="setup-step" data-step="3">
                <div class="setup-step-content">
                    <h2>性别</h2>
                    <p class="sub">选一项即可，可随时在设置中修改</p>
                    <div class="field-wrap">
                        <div class="gender-options">
                            <input type="radio" name="gender" id="g_male" value="male">
                            <label for="g_male" class="option">男</label>
                            <input type="radio" name="gender" id="g_female" value="female">
                            <label for="g_female" class="option">女</label>
                            <input type="radio" name="gender" id="g_other" value="other" checked>
                            <label for="g_other" class="option">其他</label>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <div class="setup-nav">
            <div class="setup-progress" id="progress">
                <span class="dot active" data-step="0"></span>
                <span class="dot" data-step="1"></span>
                <span class="dot" data-step="2"></span>
                <span class="dot" data-step="3"></span>
            </div>
            <div class="setup-nav-btns">
                <button type="button" class="btn btn-back" id="btnBack" disabled>上一步</button>
                <button type="button" class="btn btn-next" id="btnNext">下一步</button>
            </div>
        </div>
        <div class="setup-error" id="setupErrorMessage"></div>
    </div>

    <script src="js/auth-storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
    <script data-auth-page-script>
        document.querySelectorAll('[data-password-toggle]').forEach(function (button) {
            button.addEventListener('click', function () {
                var input = document.getElementById(button.getAttribute('aria-controls'));
                if (!input) return;
                var willShow = input.type === 'password';
                input.type = willShow ? 'text' : 'password';
                button.setAttribute('aria-pressed', String(willShow));
                button.setAttribute('aria-label', willShow ? '隐藏密码' : '显示密码');
                var label = button.querySelector('[data-password-toggle-label]');
                if (label) label.textContent = willShow ? '隐藏密码' : '显示密码';
            });
        });
    </script>
</body>
</html>
